{% extends "base.html" %}{% block title %}Log in{% endblock %}{% block content %}
<div class="auth-card"><span class="eyebrow">WELCOME BACK</span><h1>Log in</h1><form method="post">
<label>Username or email<input name="identity" required autocomplete="username"></label>
<label>Password<input type="password" name="password" required autocomplete="current-password"></label>
<button class="btn full">Log in</button></form><p class="muted">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div>{% endblock %}
